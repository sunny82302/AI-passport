<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSH 14 Days AI Passport - 英雄排行榜</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #0056b3;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      padding: 20px;
      color: #333;
    }

    .main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 10px 0 15px;
    }

    .header h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    /* 📢 跑馬燈（已加上防破格與遮擋修復） */
    .marquee-container {
      background: #0056b3;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      position: relative;
    }

    .marquee-label {
      font-weight: bold;
      background: #ffc107;
      color: #333;
      padding: 4px 10px;
      border-radius: 4px;
      margin-right: 15px;
      font-size: 0.85em;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      box-shadow: 2px 0 5px rgba(0,0,0,0.2);
    }

    .marquee-scroll-area {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }

    .marquee-content {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 22s linear infinite;
    }

    .marquee-content span {
      margin-right: 40px;
      font-size: 0.95em;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    .marquee-container:hover .marquee-content {
      animation-play-state: paused;
    }

    /* 雙欄與手機響應式版面 */
    .content-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .sidebar {
      width: 300px;
      flex-shrink: 0;
      position: sticky;
      top: 20px;
    }

    .main-content {
      flex: 1;
      min-width: 0;
    }

    .section-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    h3 {
      color: var(--primary);
      margin-top: 0;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 10px;
    }

    /* 登入查詢區 */
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
    }

    .login-box button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .user-profile {
      display: none;
      background: #eef5ff;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    .user-profile.active {
      display: block;
    }

    .avatar-icon {
      font-size: 40px;
      text-align: center;
      margin-bottom: 5px;
    }

    /* 打卡表單容器 */
    .form-container iframe {
      width: 100%;
      height: 650px;
      border: none;
      border-radius: 8px;
    }

    /* 🏆 Top 3 英雄殿堂 */
    .top-three {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .podium-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      flex: 1;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .podium-card.rank-1 { border-top: 5px solid var(--gold); }
    .podium-card.rank-2 { border-top: 5px solid var(--silver); }
    .podium-card.rank-3 { border-top: 5px solid var(--bronze); }

    .badge { font-size: 24px; }
    .user-name { font-weight: bold; font-size: 1.1em; margin-top: 5px; }
    .days-count { color: var(--primary); font-size: 0.9em; margin-top: 5px; }

    /* 排行榜列表 */
    .leader-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .leader-row:last-child { border-bottom: none; }
    .rank-num { width: 40px; font-weight: bold; text-align: center; }
    .name-section { width: 140px; font-weight: 600; }
    .emp-id { font-size: 0.8em; color: #6c757d; font-weight: normal; }
    .progress-section { flex: 1; padding: 0 15px; }

    .progress-bar-bg {
      background: #e9ecef;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #28a745, #20c997);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease-in-out;
    }

    .score-badge { width: 90px; text-align: right; font-weight: bold; color: var(--primary); }

    /* 14天題庫區 */
    .tasks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .task-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px 15px;
    }

    .task-day {
      font-weight: bold;
      color: var(--primary);
      font-size: 0.9em;
    }

    .task-title {
      font-weight: 600;
      margin: 5px 0;
    }

    .task-desc {
      font-size: 0.85em;
      color: #6c757d;
      line-height: 1.4;
    }

    @media (max-width: 900px) {
      .content-layout { flex-direction: column; }
      .sidebar { width: 100%; position: static; }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header">
    <h1>🚀 BSH 14 Days AI Passport</h1>
    <p>每日解鎖 AI 技能，挑戰 14 天護照成就！</p>
  </div>

  <!-- 📢 頂部廣播跑馬燈（防破格修復版） -->
  <div class="marquee-container">
    <div class="marquee-label">⚡ 即時戰報</div>
    <div class="marquee-scroll-area">
      <div class="marquee-content" id="marqueeText">
        <span>🎉 挑戰進行中，完成打卡即可躍上英雄榜！</span>
      </div>
    </div>
  </div>

  <div class="content-layout">
    
    <!-- 👈 左側邊欄：身份查詢 / 登入 -->
    <div class="sidebar">
      <div class="section-box login-box">
        <h3>👤 快速身份查詢</h3>
        <label for="empInput" style="font-size:0.85em; color:#555;">輸入員工編號 (如 5404/E001)</label>
        <input type="text" id="empInput" placeholder="請輸入 4 碼工號" maxlength="4">
        <button onclick="checkUserProgress()">查詢個人通關進度</button>

        <div class="user-profile" id="userProfile">
          <div class="avatar-icon">🏅</div>
          <div style="text-align:center; font-weight:bold; margin-bottom:5px;" id="profileName">--</div>
          <div style="font-size:0.85em; color:#666; text-align:center;" id="profileEmpId">工號: --</div>
          <hr style="border:none; border-top:1px dashed #ccc; margin:10px 0;">
          <div style="font-size:0.9em; margin-bottom:5px;">累積通關：<b id="profileDays" style="color:var(--primary);">0</b> / 14 天</div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="profileBar" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 👉 右側主內容區 -->
    <div class="main-content">
      
      <!-- 1. 🏆 Top 3 英雄殿堂 -->
      <div class="top-three">
        <div class="podium-card rank-1">
          <div class="badge">🥇 No.1</div>
          <div class="user-name" id="top1-name">尚無紀錄</div>
          <div class="days-count" id="top1-days">0 / 14 天</div>
        </div>
        <div class="podium-card rank-2">
          <div class="badge">🥈 No.2</div>
          <div class="user-name" id="top2-name">尚無紀錄</div>
          <div class="days-count" id="top2-days">0 / 14 天</div>
        </div>
        <div class="podium-card rank-3">
          <div class="badge">🥉 No.3</div>
          <div class="user-name" id="top3-name">尚無紀錄</div>
          <div class="days-count" id="top3-days">0 / 14 天</div>
        </div>
      </div>

      <!-- 2. 📊 全員即時英雄榜 -->
      <div class="section-box">
        <h3>📊 全員即時英雄榜</h3>
        <div id="leaderboardList">
          <div style="color:#888; text-align:center; padding:20px;">排行榜載入中...</div>
        </div>
      </div>

      <!-- 3. 🎯 14 天挑戰關卡清單 -->
      <div class="section-box">
        <h3>🎯 14 天挑戰關卡清單</h3>
        <div class="tasks-grid" id="tasksGrid">
          <div style="color:#888;">正在同步最新題目...</div>
        </div>
      </div>

      <!-- 4. ✍️ 打卡輸入區 -->
      <div class="section-box form-container">
        <h3>✍️ 任務完成打卡</h3>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe-z3Ps5rTHiiGBhXJdwgalr_cozg_mtVUuIYU10SZePShj_A/viewform?embedded=true" width="100%" height="650" frameborder="0" marginheight="0" marginwidth="0">載入中…</iframe>
      </div>

    </div>

  </div>
</div>

<script>
  // ⚡ 連結發布成功的 Google Apps Script Web App API
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxxDfcML0ZiulZEF4Ar1navVTfMfqH34NE35wQdP-nRn_quFgSUKCv_r_Gf2te8LK_hlg/exec';
  const TASKS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGC3l4Kc0kleJptRRIPMJVoGin4NlMBxXEhDwp4R6xVHvk_R_u5GjEKMt7z4xkr0-71bQRWkD3jUSk/pub?output=csv';

  let globalUserMap = {};

  function fetchTasks() {
    Papa.parse(TASKS_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const tasksGrid = document.getElementById('tasksGrid');
        tasksGrid.innerHTML = '';
        results.data.forEach(row => {
          const day = row['Day'] || row['day'];
          const title = row['Mission Title'] || row['title'];
          const desc = row['Mission Description'] || row['description'];
          if (day && title) {
            tasksGrid.innerHTML += `
              <div class="task-card">
                <div class="task-day">Day ${String(day).padStart(2, '0')}</div>
                <div class="task-title">${title}</div>
                <div class="task-desc">${desc || ''}</div>
              </div>
            `;
          }
        });
      }
    });
  }

  // 🛡️ 具備 Set 去重防呆機制（重複打卡同一關不累加天數）
  function fetchLeaderboard() {
    fetch(GAS_API_URL)
      .then(res => res.json())
      .then(data => {
        globalUserMap = {};
        const recentLogs = [];

        data.forEach(item => {
          const empId = item.empId;
          const name = item.name;
          const taskDay = item.taskDay;

          if (empId) {
            if (!globalUserMap[empId]) {
              globalUserMap[empId] = { 
                name: name || empId, 
                empId: empId, 
                completedDaysSet: new Set() 
              };
            }
            
            // 使用 Set 自動去重，同一 Day 只算 1 次
            if (taskDay) {
              globalUserMap[empId].completedDaysSet.add(taskDay);
            } else {
              // 備援：若無關卡欄位則以筆數記（防呆）
              globalUserMap[empId].completedDaysSet.add(`Entry_${globalUserMap[empId].completedDaysSet.size + 1}`);
            }

            recentLogs.push({ 
              name: name || empId, 
              empId: empId, 
              currentDays: globalUserMap[empId].completedDaysSet.size 
            });
          }
        });

        // 計算 Set 大小作為實際通關天數
        const sortedUsers = Object.values(globalUserMap)
          .map(user => ({ 
            name: user.name, 
            empId: user.empId, 
            days: Math.min(user.completedDaysSet.size, 14) 
          }))
          .sort((a, b) => b.days - a.days);

        renderLeaderboard(sortedUsers);
        updateMarquee(recentLogs, sortedUsers);
      })
      .catch(err => console.error('GAS Fetch Error:', err));
  }

  function updateMarquee(logs, sortedUsers) {
    const marqueeContainer = document.getElementById('marqueeText');
    if (logs.length === 0) {
      marqueeContainer.innerHTML = '<span>🚀 挑戰剛開始，快成為第一個通關打卡的英雄！</span>';
      return;
    }

    let marqueeHtml = '';
    if (sortedUsers[0]) marqueeHtml += `<span>👑 <b>No.1</b> ${sortedUsers[0].name} (${sortedUsers[0].days}/14天)</span>`;
    if (sortedUsers[1]) marqueeHtml += `<span>🥈 <b>No.2</b> ${sortedUsers[1].name} (${sortedUsers[1].days}/14天)</span>`;
    if (sortedUsers[2]) marqueeHtml += `<span>🥉 <b>No.3</b> ${sortedUsers[2].name} (${sortedUsers[2].days}/14天)</span>`;

    const recent = logs.slice(-3).reverse();
    recent.forEach(log => {
      marqueeHtml += `<span>🔥 <b>${log.name}</b> (${log.empId}) 完成打卡！累積 <b>${Math.min(log.currentDays, 14)}/14 天</b></span>`;
    });

    marqueeContainer.innerHTML = marqueeHtml;
  }

  function checkUserProgress() {
    const inputId = document.getElementById('empInput').value.trim().toUpperCase();
    const profileBox = document.getElementById('userProfile');

    if (!inputId) {
      alert('請輸入員工編號！');
      return;
    }

    const userData = globalUserMap[inputId];
    profileBox.classList.add('active');

    if (userData) {
      const daysCount = Math.min(userData.completedDaysSet.size, 14);
      document.getElementById('profileName').innerText = userData.name;
      document.getElementById('profileEmpId').innerText = `工號: ${userData.empId}`;
      document.getElementById('profileDays').innerText = daysCount;
      document.getElementById('profileBar').style.width = `${(daysCount / 14) * 100}%`;
    } else {
      document.getElementById('profileName').innerText = '查無資料 / 未打卡';
      document.getElementById('profileEmpId').innerText = `工號: ${inputId}`;
      document.getElementById('profileDays').innerText = '0';
      document.getElementById('profileBar').style.width = '0%';
    }
  }

  function renderLeaderboard(users) {
    document.getElementById('top1-name').innerText = users[0] ? users[0].name : '尚無紀錄';
    document.getElementById('top1-days').innerText = users[0] ? `${users[0].days} / 14 天` : '0 / 14 天';

    document.getElementById('top2-name').innerText = users[1] ? users[1].name : '尚無紀錄';
    document.getElementById('top2-days').innerText = users[1] ? `${users[1].days} / 14 天` : '0 / 14 天';

    document.getElementById('top3-name').innerText = users[2] ? users[2].name : '尚無紀錄';
    document.getElementById('top3-days').innerText = users[2] ? `${users[2].days} / 14 天` : '0 / 14 天';

    const listContainer = document.getElementById('leaderboardList');
    listContainer.innerHTML = '';

    if (users.length === 0) {
      listContainer.innerHTML = '<div style="color:#888; text-align:center; padding:15px;">目前尚無打卡紀錄，快成為第一個通關的人！</div>';
      return;
    }

    users.forEach((user, index) => {
      const percentage = (user.days / 14) * 100;
      listContainer.innerHTML += `
        <div class="leader-row">
          <div class="rank-num">${index + 1}</div>
          <div class="name-section">
            ${user.name}
            <div class="emp-id">(${user.empId})</div>
          </div>
          <div class="progress-section">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percentage}%"></div>
            </div>
          </div>
          <div class="score-badge">${user.days} / 14 天</div>
        </div>
      `;
    });
  }

  fetchTasks();
  fetchLeaderboard();
  setInterval(fetchLeaderboard, 15000);
</script>

</body>
</html>
