<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSH 10 Days AI Passport 2026</title>
  <style>
    :root {
      --bosch-orange: #F26A3D;
      --bosch-dark-orange: #C94A25;
      --bosch-dark: #2B303A;
      --gray-bg: #F7F9FB;
      --gray-card: #FFFFFF;
      --line-color: #E2E8F0;
      --muted-text: #64748B;
      --light-orange: #FFF0E8;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      --radius: 20px;
      
      --gold: #D69E2E;
      --silver: #A0AEC0;
      --bronze: #DD6B20;

      --chatgpt-bg: #F0FDF4; --chatgpt-border: #BBF7D0; --chatgpt-accent: #16A34A;
      --gemini-bg: #F0F9FF; --gemini-border: #BAE6FD; --gemini-accent: #0284C7;
      --copilot-bg: #F5F3FF; --copilot-border: #DDD6FE; --copilot-accent: #7C3AED;

      --current-accent: var(--bosch-orange);
      --current-accent-bg: var(--light-orange);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--gray-bg);
      color: var(--bosch-dark);
      padding: 30px 20px 80px;
      min-height: 100vh;
      line-height: 1.5;
    }

    .brand-strip {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--bosch-orange) 0%, #000000 100%);
      z-index: 100;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--gray-card);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-title h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--bosch-dark);
      letter-spacing: -0.5px;
    }

    .header-title p {
      color: var(--muted-text);
      font-size: 14px;
      margin-top: 4px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--gray-bg);
      padding: 10px 18px;
      border-radius: 50px;
      border: 1px solid var(--line-color);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: var(--bosch-orange);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      background: var(--gray-card);
      border: 1px solid var(--line-color);
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted-text);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--bosch-dark);
      color: white;
      border-color: var(--bosch-dark);
      box-shadow: 0 4px 12px rgba(43, 48, 58, 0.15);
    }

    .card {
      background: var(--gray-card);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line-color);
      margin-bottom: 24px;
    }

    .day-selector {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 10px;
      margin-bottom: 28px;
    }

    .day-btn {
      padding: 12px 8px;
      border-radius: 12px;
      border: 1px solid var(--line-color);
      background: var(--gray-bg);
      color: var(--bosch-dark);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .day-btn.active {
      background: var(--bosch-orange);
      color: white;
      border-color: var(--bosch-orange);
    }

    .day-btn.completed {
      border-color: #16A34A;
      background: #F0FDF4;
      color: #16A34A;
    }

    .task-header {
      border-bottom: 1px solid var(--line-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .task-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--bosch-dark);
    }

    .task-desc {
      color: var(--muted-text);
      font-size: 14px;
      margin-top: 6px;
    }

    .tool-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 10px;
    }

    .badge-chatgpt { background: var(--chatgpt-bg); color: var(--chatgpt-accent); border: 1px solid var(--chatgpt-border); }
    .badge-gemini { background: var(--gemini-bg); color: var(--gemini-accent); border: 1px solid var(--gemini-border); }
    .badge-copilot { background: var(--copilot-bg); color: var(--copilot-accent); border: 1px solid var(--copilot-border); }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--bosch-dark);
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line-color);
      background: var(--gray-bg);
      font-size: 14px;
      transition: all 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--bosch-orange);
      background: white;
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: var(--bosch-orange);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(242, 106, 61, 0.25);
    }

    .btn-submit:hover {
      background: var(--bosch-dark-orange);
    }

    /* Leaderboard Styles */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 16px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line-color);
    }

    .leaderboard-table th {
      font-size: 13px;
      color: var(--muted-text);
      font-weight: 700;
      text-transform: uppercase;
    }

    .rank-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }

    .rank-1 { background: #FEF3C7; color: var(--gold); }
    .rank-2 { background: #E2E8F0; color: var(--silver); }
    .rank-3 { background: #FFEDD5; color: var(--bronze); }

    /* Modal / Login Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-card {
      background: white;
      padding: 40px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="brand-strip"></div>

  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">歡迎參加 AI 護照挑戰</h2>
      <p style="color: var(--muted-text); font-size: 14px; margin-bottom: 24px;">請輸入您的員工姓名以登入系統</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="userNameInput">員工姓名</label>
          <input type="text" id="userNameInput" class="form-control" placeholder="例如：張小明" required />
        </div>
        <button type="submit" class="btn-submit">進入護照系統</button>
      </form>
    </div>
  </div>

  <div class="container">
    
    <!-- Header -->
    <header class="header-card">
      <div class="header-title">
        <h1>BSH AI Passport</h1>
        <p>10 天 AI 應用能力升級計畫</p>
      </div>
      <div class="user-profile">
        <div id="userAvatar" class="user-avatar">?</div>
        <div>
          <div id="displayName" style="font-weight: 700; font-size: 14px;">未登入</div>
          <div id="userScore" style="font-size: 12px; color: var(--muted-text);">已完成 0 / 10 天</div>
        </div>
        <button id="logoutBtn" style="border:none; background:none; color: var(--muted-text); cursor:pointer; font-size: 12px; margin-left: 10px;">登出</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <div id="tabPassport" class="tab-btn active" onclick="switchTab('passport')">我的 AI 護照</div>
      <div id="tabLeaderboard" class="tab-btn" onclick="switchTab('leaderboard')">英雄排行榜</div>
    </div>

    <!-- Passport View -->
    <main id="viewPassport">
      <div class="card">
        <div class="day-selector" id="daySelector">
          <!-- Day buttons populated by JS -->
        </div>

        <div class="task-header">
          <div id="taskTitle" class="task-title">Day 1</div>
          <div id="taskToolBadge" class="tool-badge badge-chatgpt">ChatGPT</div>
          <div id="taskDesc" class="task-desc">讀取中...</div>
        </div>

        <form id="checkinForm">
          <div class="form-group">
            <label for="promptInput">您的 Prompt 指令</label>
            <textarea id="promptInput" class="form-control" placeholder="請貼上您輸入給 AI 的 Prompt 指令..." required></textarea>
          </div>
          <div class="form-group">
            <label for="resultInput">AI 回覆結果或心得總結</label>
            <textarea id="resultInput" class="form-control" placeholder="請簡述 AI 給予的解答或您的學習心得..." required></textarea>
          </div>
          <button type="submit" class="btn-submit">完成今日打卡</button>
        </form>
      </div>
    </main>

    <!-- Leaderboard View -->
    <main id="viewLeaderboard" class="hidden">
      <div class="card">
        <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 20px;">全公司學習英雄榜</h2>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>排名</th>
              <th>成員</th>
              <th>完成天數</th>
              <th>最後打卡</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <!-- Leaderboard rows populated by JS -->
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <script>
    // 遊戲題目資料庫 (Day 1 ~ 10 完整不簡化)
    const TASKS = [
      {
        day: 1,
        title: "Day 1: AI 基礎指令與角色設定",
        tool: "ChatGPT",
        badgeClass: "badge-chatgpt",
        desc: "學習如何為 AI 設定明確的角色身份（System Role），並給予精準的背景脈絡（Context）以取得高質量的回答。"
      },
      {
        day: 2,
        title: "Day 2: 商業 Email 寫作與修飾",
        tool: "ChatGPT",
        badgeClass: "badge-chatgpt",
        desc: "運用 AI 撰寫、潤飾優雅專業的英文商業郵件，調整語氣（Tone of Voice）適應不同職級收件者。"
      },
      {
        day: 3,
        title: "Day 3: 長篇文件摘要與關鍵觀點提取",
        tool: "Gemini",
        badgeClass: "badge-gemini",
        desc: "利用 Gemini 解析長篇報告或 PDF 文章，快速生成精簡的 Executive Summary 與關鍵條列說明。"
      },
      {
        day: 4,
        title: "Day 4: 數據分析與 Excel 公式生成",
        tool: "ChatGPT",
        badgeClass: "badge-chatgpt",
        desc: "描述數據情境，讓 AI 為你撰寫複雜的 Excel/Google Sheets 公式（如 VLOOKUP, INDEX/MATCH）或 Python 數據處理邏輯。"
      },
      {
        day: 5,
        title: "Day 5: 跨語言翻譯與在地化調整",
        tool: "Gemini",
        badgeClass: "badge-gemini",
        desc: "超越傳統翻譯，要求 AI 在翻譯的同時保留業界專有名詞（Glossary）並進行在地化語境優化。"
      },
      {
        day: 6,
        title: "Day 6: 程式碼檢視與 Bug 除錯助手",
        tool: "Copilot",
        badgeClass: "badge-copilot",
        desc: "將遇到錯誤的程式碼片段貼給 AI，要求其進行 Code Review，指明錯誤原因此給予重構建議。"
      },
      {
        day: 7,
        title: "Day 7: 會議記錄轉化為行動方案 (Action Items)",
        tool: "ChatGPT",
        badgeClass: "badge-chatgpt",
        desc: "輸入雜亂的會議逐字稿或隨手筆記，請 AI 自動歸納決定事項（Decisions）與責任分工行動點。"
      },
      {
        day: 8,
        title: "Day 8: 創意腦力激盪與企劃發想",
        tool: "Gemini",
        badgeClass: "badge-gemini",
        desc: "使用 SCAMPER 思考法或六頂思考帽框架，引導 AI 一起進行產品或活動行銷提案的創意發想。"
      },
      {
        day: 9,
        title: "Day 9: 自動化 Workflow 邏輯規劃",
        tool: "Copilot",
        badgeClass: "badge-copilot",
        desc: "規劃跨工具（如 Outlook, Power Automate, Teams）的自動化流程，讓 AI 幫忙拆解步驟與條件判斷。"
      },
      {
        day: 10,
        title: "Day 10: 打造專屬的 Custom Prompt 模板",
        tool: "ChatGPT",
        badgeClass: "badge-chatgpt",
        desc: "整合前幾天所學，設計一套屬於你個人工作領域的高效模組化 Prompt 模板，並分享其應用效益。"
      }
    ];

    // 全局狀態
    let currentUser = localStorage.getItem('bsh_passport_user') || null;
    let currentDay = 1;
    let checkinData = JSON.parse(localStorage.getItem('bsh_passport_records')) || {};

    // 初始化 App
    document.addEventListener("DOMContentLoaded", () => {
      initAuth();
      renderDaySelector();
      loadTask(currentDay);
      setupEventListeners();
    });

    // 驗證機制與登入邏輯修正
    function initAuth() {
      const loginModal = document.getElementById('loginModal');
      if (currentUser) {
        loginModal.classList.add('hidden');
        updateUserUI();
      } else {
        loginModal.classList.remove('hidden');
      }
    }

    function updateUserUI() {
      if (!currentUser) return;
      document.getElementById('displayName').innerText = currentUser;
      document.getElementById('userAvatar').innerText = currentUser.charAt(0).toUpperCase();
      
      const userRecords = checkinData[currentUser] || {};
      const completedCount = Object.keys(userRecords).length;
      document.getElementById('userScore').innerText = `已完成 ${completedCount} / 10 天`;
    }

    // 事件監聽設置
    function setupEventListeners() {
      // 登入表單提交
      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const inputName = document.getElementById('userNameInput').value.trim();
        if (inputName) {
          currentUser = inputName;
          localStorage.setItem('bsh_passport_user', currentUser);
          document.getElementById('loginModal').classList.add('hidden');
          updateUserUI();
          renderDaySelector();
          loadTask(currentDay);
        }
      });

      // 登出按鈕
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('bsh_passport_user');
        currentUser = null;
        document.getElementById('userNameInput').value = '';
        initAuth();
      });

      // 打卡表單提交
      document.getElementById('checkinForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!currentUser) {
          alert('請先登入！');
          initAuth();
          return;
        }

        const prompt = document.getElementById('promptInput').value.trim();
        const result = document.getElementById('resultInput').value.trim();

        if (!checkinData[currentUser]) {
          checkinData[currentUser] = {};
        }

        checkinData[currentUser][currentDay] = {
          prompt: prompt,
          result: result,
          timestamp: new Date().toISOString()
        };

        localStorage.setItem('bsh_passport_records', JSON.stringify(checkinData));
        alert(`Day ${currentDay} 打卡成功！`);
        
        updateUserUI();
        renderDaySelector();
      });
    }

    // 渲染天數選擇器
    function renderDaySelector() {
      const container = document.getElementById('daySelector');
      container.innerHTML = '';

      const userRecords = currentUser && checkinData[currentUser] ? checkinData[currentUser] : {};

      TASKS.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'day-btn';
        if (item.day === currentDay) btn.classList.add('active');
        if (userRecords[item.day]) btn.classList.add('completed');
        
        btn.innerText = `Day ${item.day}`;
        btn.onclick = () => {
          currentDay = item.day;
          renderDaySelector();
          loadTask(currentDay);
        };
        container.appendChild(btn);
      });
    }

    // 載入當前天數任務與打卡紀錄
    function loadTask(day) {
      const task = TASKS.find(t => t.day === day);
      if (!task) return;

      document.getElementById('taskTitle').innerText = task.title;
      document.getElementById('taskDesc').innerText = task.desc;
      
      const badge = document.getElementById('taskToolBadge');
      badge.innerText = task.tool;
      badge.className = `tool-badge ${task.badgeClass}`;

      // 載入已保存打卡內容（若有）
      const userRecords = currentUser && checkinData[currentUser] ? checkinData[currentUser] : {};
      const record = userRecords[day];

      if (record) {
        document.getElementById('promptInput').value = record.prompt || '';
        document.getElementById('resultInput').value = record.result || '';
      } else {
        document.getElementById('promptInput').value = '';
        document.getElementById('resultInput').value = '';
      }
    }

    // 切換 Tab
    function switchTab(tab) {
      document.getElementById('tabPassport').classList.toggle('active', tab === 'passport');
      document.getElementById('tabLeaderboard').classList.toggle('active', tab === 'leaderboard');

      document.getElementById('viewPassport').classList.toggle('hidden', tab !== 'passport');
      document.getElementById('viewLeaderboard').classList.toggle('hidden', tab !== 'leaderboard');

      if (tab === 'leaderboard') {
        renderLeaderboard();
      }
    }

    // 渲染英雄排行榜
    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';

      const userList = Object.keys(checkinData).map(name => {
        const records = checkinData[name];
        const completedDays = Object.keys(records).length;
        
        // 取得最後打卡時間
        let lastTime = 0;
        Object.values(records).forEach(r => {
          const t = new Date(r.timestamp).getTime();
          if (t > lastTime) lastTime = t;
        });

        return { name, completedDays, lastTime };
      });

      // 排序：完成天數多者優先，天數相同則比較時間
      userList.sort((a, b) => {
        if (b.completedDays !== a.completedDays) {
          return b.completedDays - a.completedDays;
        }
        return a.lastTime - b.lastTime;
      });

      if (userList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--muted-text);">尚無打卡紀錄</td></tr>';
        return;
      }

      userList.forEach((user, index) => {
        const rank = index + 1;
        const tr = document.createElement('tr');
        
        let rankClass = '';
        if (rank === 1) rankClass = 'rank-1';
        else if (rank === 2) rankClass = 'rank-2';
        else if (rank === 3) rankClass = 'rank-3';

        const formattedTime = user.lastTime ? new Date(user.lastTime).toLocaleString('zh-TW', { hour12: false }) : '-';

        tr.innerHTML = `
          <td><div class="rank-badge ${rankClass}">${rank}</div></td>
          <td style="font-weight: 700;">${user.name}</td>
          <td><span style="color: var(--bosch-orange); font-weight: 700;">${user.completedDays}</span> / 10 天</td>
          <td style="font-size: 12px; color: var(--muted-text);">${formattedTime}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
